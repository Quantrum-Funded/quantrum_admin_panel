<!-- The Quantrum mark. Same geometry as src/components/Logo.jsx, with literal
     values because a favicon cannot run JS to compute its dasharray.
     30.258 + 4.3 = 34.558, exactly a quarter of the r=22 circumference
     (138.230), so the four gaps land on the axes.

     It sits on its own paper tile rather than on transparency. A favicon is
     drawn on the browser's tab strip, whose colour follows the OS theme and is
     not ours to know — the old near-white ring vanished on a light strip, and
     an espresso one would vanish on a dark strip. The tile makes it legible on
     both, and matches the panel's paper. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect x="0" y="0" width="100" height="100" rx="22" fill="#faf6f1"/>
  <mask id="c" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
    <rect x="0" y="0" width="100" height="100" fill="#fff"/>
    <path d="M49 55 L76 83" stroke="#000" stroke-width="13"/>
  </mask>
  <circle cx="50" cy="47" r="22" fill="none" stroke="#2b1e17" stroke-width="12.5"
          stroke-dasharray="30.258 4.3" stroke-dashoffset="-2.15" mask="url(#c)"/>
  <path d="M49 55 L74 81" stroke="#fa4f0c" stroke-width="9.5"/>
</svg>
